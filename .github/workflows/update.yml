name: Update wrestling archive data

on:
  schedule:
    # 毎日 日本時間 6:00 (UTC 21:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest videos and rebuild data.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python update_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json build_report.json
          git diff --cached --quiet || git commit -m "Update data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

