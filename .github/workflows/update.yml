name: Update wrestling archive data

on:
  schedule:
    # 毎日 日本時間 6:00 (UTC 21:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: {}
  # データやしくみのファイルを変えた PR をマージしたら、すぐにページを作り直す(#75)。
  # PR にはページ(events/ players/ en/ など)や data.json を入れない決まりにしたので、ここで作り直す。
  # この作業自身の保存(github-actions の push)では、もう一度動くことはない
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'index.html'
      - 'overrides.json'
      - 'master_events.json'
      - 'series_aliases.json'
      - 'legacy_map.json'
      - 'players.csv'
      - 'player_results.csv'
      - 'player_video_exclude.csv'
      - 'champions.csv'
      - 'en_names.csv'
      - 'translations_en.json'
      - 'photos.json'
      - 'tech_*.json'

permissions:
  contents: write

# 2つの実行が同時に動いて書き込みがぶつからないように、1つずつ順番に実行する
concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Fetch latest videos, rebuild data.json and pages
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 英語版の機械翻訳(DeepL)。未登録なら翻訳だけ飛ばす
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python update_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 写真の縮小版は assets/photos/ に、写真ページは photos/ の下(index.html)に作られる
          git add data.json build_report.json page_slugs.json sitemap.xml robots.txt 404.html contact.html llms.txt llms-full.txt assets events technique players photos champions privacy faq uww en translations_en.json
          git diff --cached --quiet || git commit -m "Update data and pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 実行中にファイルがアップロードされていた場合は、その変更を取り込んでから保存する
          git pull --rebase --autostash
          git push
