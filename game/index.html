<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120d0c">
<title>レスリング人生 〜オリンピックへの道〜</title>
<style>
:root {
  --bg: #120d0c;
  --panel: #1f1715;
  --panel2: #2a1f1c;
  --line: #3d2d28;
  --text: #f3ece6;
  --muted: #b3a49b;
  --red: #c8102e;
  --red2: #8e0b20;
  --gold: #d9ad3c;
  --gold2: #f3d27a;
  --green: #4caf7a;
  --blue: #5b9bd5;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg) radial-gradient(ellipse at top, #2b1512 0%, var(--bg) 60%) no-repeat;
  color: var(--text);
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 480px; margin: 0 auto; padding: 12px 12px 40px; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.title-logo { text-align: center; padding: 36px 0 18px; }
.title-logo .sub { color: var(--gold); letter-spacing: .2em; font-size: 13px; }
.title-logo h1 { font-size: 30px; margin: 6px 0; text-shadow: 0 2px 0 var(--red2); }
.title-logo .road { color: var(--gold2); font-size: 17px; }
.mat { width: 120px; height: 120px; margin: 18px auto; border-radius: 50%;
  background: radial-gradient(circle, var(--red) 0 38%, var(--gold) 38% 42%, var(--red2) 42% 100%);
  box-shadow: 0 0 30px rgba(200,16,46,.35); display: flex; align-items: center; justify-content: center; font-size: 46px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 10px 0; }
.card.gold { border-color: var(--gold); box-shadow: 0 0 18px rgba(217,173,60,.25); }
.card.red { border-color: var(--red); }
.label { color: var(--muted); font-size: 12px; }
.big { font-size: 22px; font-weight: bold; }
.gold-t { color: var(--gold2); }
.red-t { color: #ff5a6e; }
.green-t { color: var(--green); }
.muted { color: var(--muted); }
.center { text-align: center; }
input[type=text] {
  width: 100%; font-size: 17px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: #0c0908; color: var(--text); outline: none;
}
input[type=text]:focus { border-color: var(--gold); }
.btn {
  display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px 12px; margin: 10px 0 0;
  font-size: 17px; font-weight: bold; color: #fff; background: linear-gradient(180deg, var(--red), var(--red2));
  cursor: pointer; font-family: inherit; touch-action: manipulation;
}
.btn:active { transform: translateY(1px); filter: brightness(.9); }
.btn.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #2a1a00; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: normal; font-size: 14px; padding: 10px; }
.btn:disabled { opacity: .35; cursor: default; }
.choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); font-weight: normal; }
.choice b { display: block; font-size: 16px; color: var(--gold2); }
.choice span { font-size: 13px; color: var(--muted); }
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 4px 2px 8px; border-bottom: 2px solid var(--red); }
.hdr .nm { font-size: 18px; font-weight: bold; word-break: break-all; }
.hdr .st { font-size: 12px; color: var(--muted); }
.hdr .age { font-size: 26px; font-weight: bold; color: var(--gold2); white-space: nowrap; }
.hdr .age small { font-size: 13px; color: var(--muted); }
.seasons { display: flex; gap: 6px; margin: 8px 0; }
.seasons div { flex: 1; text-align: center; font-size: 12px; padding: 4px 0; border-radius: 6px; background: var(--panel2); color: var(--muted); }
.seasons .now { background: var(--red); color: #fff; font-weight: bold; }
.seasons .done { background: #3a2a25; color: #8a7a70; text-decoration: line-through; }
.seasons .tour { background: #3b2e10; color: var(--gold2); }
.stat { display: grid; grid-template-columns: 72px 1fr 34px; gap: 6px; align-items: center; margin: 5px 0; font-size: 13px; }
.stat .nm small { display: block; color: var(--gold); font-size: 10px; letter-spacing: -1px; line-height: 1; }
.bar { height: 12px; background: #0b0807; border-radius: 6px; overflow: hidden; border: 1px solid #2f2320; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red2), var(--red)); border-radius: 6px; }
.bar.fat i { background: linear-gradient(90deg, #3b7a57, #d9ad3c 60%, #c8102e); }
.stat .v { text-align: right; font-weight: bold; }
.power { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 13px; }
.msg { background: #0e0a09; border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 6px; font-size: 13px; margin: 8px 0; white-space: pre-line; }
.menus { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.menus .btn { margin: 0; padding: 10px 8px; text-align: left; background: var(--panel2); border: 1px solid var(--line); font-weight: normal; }
.menus .btn b { display: block; font-size: 15px; color: var(--text); }
.menus .btn span { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; }
.menus .btn.rest { background: #18241d; border-color: #2c4636; }
.menus .btn.rest b { color: #9fe0b8; }
.menus .btn.spar { border-color: #5a2a2a; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; text-align: center; }
.vs .side { background: var(--panel2); border-radius: 10px; padding: 8px 4px; word-break: break-all; }
.vs .side.me { border: 1px solid var(--red); }
.vs .side .p { font-size: 11px; color: var(--muted); }
.vs .x { font-weight: bold; color: var(--gold); }
.score { font-size: 34px; font-weight: bold; text-align: center; letter-spacing: .1em; margin: 8px 0; }
.period { font-size: 13px; margin: 6px 0; padding: 6px 8px; background: #0e0a09; border-radius: 6px; }
.period .ph { color: var(--gold); font-weight: bold; }
.result { text-align: center; font-size: 22px; font-weight: bold; margin: 6px 0; }
.win { color: var(--gold2); }
.lose { color: #9a8a82; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--red); color: #fff; margin-left: 4px; vertical-align: middle; }
.tag.gold { background: var(--gold); color: #2a1a00; }
ul.plain { list-style: none; padding: 0; margin: 6px 0; }
ul.plain li { padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.medal { font-size: 64px; text-align: center; line-height: 1.2; }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.foot { text-align: center; margin-top: 20px; }
.foot a { color: var(--muted); font-size: 12px; }
/* 金メダルの特別エンディング */
.scene { position: relative; overflow: hidden; min-height: 62vh; display: flex; flex-direction: column; justify-content: center; text-align: center;
  background: radial-gradient(circle at 50% 30%, rgba(243,210,122,.18), transparent 60%), var(--panel); }
.scene .kicker { color: var(--gold); letter-spacing: .2em; font-size: 12px; }
.scene h1 { font-size: 28px; color: var(--gold2); margin: 10px 0; text-shadow: 0 0 18px rgba(243,210,122,.45); }
.scene p { white-space: pre-line; margin: 8px 0; position: relative; z-index: 1; }
.scene .say { background: #0e0a09; border-radius: 10px; padding: 10px; margin: 10px 4px; font-size: 14px; text-align: left; position: relative; z-index: 1; }
.rays { position: absolute; left: 50%; top: 32%; width: 600px; height: 600px; margin: -300px 0 0 -300px; z-index: 0; opacity: .18;
  background: repeating-conic-gradient(var(--gold) 0 6deg, transparent 6deg 18deg); border-radius: 50%; animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin: 14px auto 6px; position: relative; z-index: 1; }
.podium div { width: 74px; border-radius: 6px 6px 0 0; color: #2a1a00; font-weight: bold; padding-top: 6px; font-size: 12px; }
.podium .p1 { height: 96px; background: linear-gradient(var(--gold2), var(--gold)); }
.podium .p2 { height: 66px; background: linear-gradient(#e6e6e6, #a9a9a9); }
.podium .p3 { height: 48px; background: linear-gradient(#e0a774, #a8693a); }
.podium .who { display: block; font-size: 26px; margin-top: -40px; }
.flag { display: inline-block; width: 60px; height: 40px; background: #fff; border-radius: 3px; position: relative; animation: rise 2.4s ease-out both; z-index: 1; }
.flag::after { content: ''; position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #bc002d; }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 2px; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(80vh) rotate(540deg); } }
.honor { display: inline-block; margin: 8px 0; padding: 6px 16px; border: 2px solid var(--gold); border-radius: 999px; color: var(--gold2); font-weight: bold; font-size: 18px; position: relative; z-index: 1; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--gold); }
@media (prefers-reduced-motion: reduce) { .rays, .confetti i, .flag { animation: none; } .confetti { display: none; } }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pop { animation: pop .25s ease-out; }

/* ===== v2: 試合シーン・キャラクター・演出 ===== */
h1, h2, h3, .btn, .big { font-weight: 800; }
.logo { text-align: center; padding: 18px 0 4px; }
.logo .en { color: var(--gold); letter-spacing: .34em; font-size: 11px; font-weight: 700; }
.logo h1 { font-size: 40px; letter-spacing: .04em; margin: 2px 0; font-weight: 900;
  background: linear-gradient(180deg, #fff3c4 0%, var(--gold2) 40%, #b9832a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #5a0a16) drop-shadow(0 0 18px rgba(200,16,46,.5)); }
.logo .road { color: #fff; font-size: 15px; letter-spacing: .12em; }
.minirow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.minirow .btn { margin: 0; padding: 9px 2px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font-weight: 600; }
.minirow .btn b { display: block; font-size: 20px; }
#soundBtn { position: fixed; right: 8px; top: 8px; z-index: 50; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(20,14,12,.85); color: #fff; font-size: 17px; cursor: pointer; }

/* 会場 */
.arena { position: relative; height: 236px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,240,200,.22), transparent 70%),
    radial-gradient(circle at 12% 30%, rgba(255,255,255,.08) 0 1.5px, transparent 2px) 0 0 / 13px 11px,
    radial-gradient(circle at 60% 60%, rgba(255,255,255,.06) 0 1.5px, transparent 2px) 5px 6px / 17px 13px,
    linear-gradient(180deg, #0b0a12 0%, #1b1220 55%, #2a1518 100%); }
.arena.olympics { background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,230,150,.38), transparent 70%),
    radial-gradient(circle at 12% 30%, rgba(255,220,120,.16) 0 1.5px, transparent 2px) 0 0 / 13px 11px,
    radial-gradient(circle at 60% 60%, rgba(255,255,255,.1) 0 1.5px, transparent 2px) 5px 6px / 17px 13px,
    linear-gradient(180deg, #0a0c1c 0%, #1a1630 55%, #33200f 100%); }
.arena.dojo { background: linear-gradient(180deg, #2b1d14 0%, #3a2618 60%, #24160e 100%); }
.arena.park { background: linear-gradient(180deg, #23405c 0%, #3d6a7a 55%, #2c4a2c 56%, #1d331f 100%); }
.arena .beam { position: absolute; top: -20px; width: 120px; height: 300px; background: linear-gradient(180deg, rgba(255,244,200,.22), transparent 80%);
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); pointer-events: none; }
.arena .beam.l { left: 4%; transform: rotate(14deg); } .arena .beam.r { right: 4%; transform: rotate(-14deg); }
.matfloor { position: absolute; left: -12%; right: -12%; bottom: -70px; height: 150px; border-radius: 50%;
  background: radial-gradient(ellipse at center, #e9b92f 0 22%, #c8102e 22% 27%, #e9b92f 27% 58%, #c8102e 58% 66%, #1f3f8f 66% 100%);
  box-shadow: 0 -4px 24px rgba(0,0,0,.5) inset; }
.arena.dojo .matfloor { background: radial-gradient(ellipse at center, #7da05a 0 60%, #5d7d43 60% 100%); }
.arena.park .matfloor { display: none; }
.fw { position: absolute; bottom: 30px; width: 104px; height: 139px; --dir: 1; transform-origin: 50% 100%; }
.fw.a { left: calc(50% - 112px); } .fw.b { left: calc(50% + 8px); --dir: -1; }
.fw svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fw.b svg, .flipx svg { transform: scaleX(-1); }
.fw.solo { left: calc(50% - 52px); }
.fw .shadow { position: absolute; left: 14%; right: 14%; bottom: -5px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.35); }
.fw.bob { animation: bob 1.1s ease-in-out infinite alternate; }
.fw.b.bob { animation-delay: .35s; }
@keyframes bob { from { transform: translateY(0) scaleY(1); } to { transform: translateY(2px) scaleY(.975); } }
.fw.atk { animation: atk .62s cubic-bezier(.3,.8,.4,1); }
@keyframes atk { 0% { transform: none; } 45% { transform: translateX(calc(var(--dir) * 62px)) translateY(8px) rotate(calc(var(--dir) * 16deg)); } 100% { transform: none; } }
.fw.hit { animation: hit .62s ease-out; }
@keyframes hit { 0%, 30% { transform: none; } 55% { transform: translateX(calc(var(--dir) * -20px)) rotate(calc(var(--dir) * -24deg)); } 100% { transform: none; } }
.fw.push { animation: push .62s ease-out; }
@keyframes push { 0% { transform: none; } 50% { transform: translateX(calc(var(--dir) * 34px)) rotate(calc(var(--dir) * 6deg)); } 100% { transform: none; } }
.fw.throw { animation: throwm .8s ease-in-out; }
@keyframes throwm { 0% { transform: none; } 40% { transform: translateX(calc(var(--dir) * 50px)) translateY(-18px) rotate(calc(var(--dir) * -30deg)); } 100% { transform: none; } }
.fw.fly { animation: fly .8s ease-in-out; }
@keyframes fly { 0%, 25% { transform: none; } 55% { transform: translateY(-64px) rotate(calc(var(--dir) * -170deg)); } 80% { transform: translateY(6px) rotate(calc(var(--dir) * -80deg)); } 100% { transform: none; } }
.fw.down { transform: translateY(34px) translateX(calc(var(--dir) * -10px)) rotate(calc(var(--dir) * -84deg)); transition: transform .45s ease-in; }
.fw.pin { transform: translateX(calc(var(--dir) * 58px)) translateY(14px) rotate(calc(var(--dir) * 28deg)); transition: transform .45s ease-in; }
.fw.sad { transform: translateY(6px) scale(.96); filter: saturate(.5) brightness(.8); transition: all .5s; }
.fw.jump { animation: jump .55s ease-out infinite alternate; }
@keyframes jump { from { transform: translateY(0); } to { transform: translateY(-16px); } }
.sb { position: absolute; left: 8px; right: 8px; top: 8px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; z-index: 3; }
.sb .t { border-radius: 8px; padding: 4px 8px; background: rgba(10,8,8,.82); display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
.sb .t.me { border-left: 5px solid #e22a48; } .sb .t.op { border-right: 5px solid #2f66e0; flex-direction: row-reverse; }
.sb .t.op.rival { border-right-color: #c9a227; } .sb .t.op.champ { border-right-color: #23a56b; }
.sb .n { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sb .s { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sb .s.bump { animation: bump .4s; }
@keyframes bump { 40% { transform: scale(1.7); color: var(--gold2); } }
.sb .mid { text-align: center; font-size: 10px; color: var(--gold2); background: rgba(10,8,8,.82); border-radius: 8px; padding: 3px 7px; line-height: 1.3; }
.sb .mid b { display: block; font-size: 14px; color: #fff; font-variant-numeric: tabular-nums; }
.callout { position: absolute; left: 0; right: 0; top: 62px; text-align: center; z-index: 4; pointer-events: none; font-weight: 900; font-size: 20px;
  text-shadow: 0 2px 0 #000, 0 0 14px rgba(0,0,0,.9); animation: callout 1s ease-out both; }
.callout.me { color: var(--gold2); } .callout.op { color: #8fb4ff; }
.callout small { display: block; font-size: 30px; }
@keyframes callout { 0% { transform: translateY(16px) scale(.6); opacity: 0; } 25% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
.bannerx { position: absolute; left: 0; right: 0; top: 78px; text-align: center; z-index: 5; font-weight: 900; font-size: 34px; letter-spacing: .08em;
  animation: bannerin .5s cubic-bezier(.2,1.6,.4,1) both; text-shadow: 0 3px 0 #000, 0 0 22px rgba(0,0,0,.9); }
.bannerx.win { color: var(--gold2); } .bannerx.lose { color: #b9b0aa; } .bannerx.info { color: #fff; font-size: 24px; }
@keyframes bannerin { from { transform: scale(2.4); opacity: 0; } to { transform: none; opacity: 1; } }
.arena.flash::after { content: ''; position: absolute; inset: 0; background: #fff; animation: flash .35s ease-out both; pointer-events: none; z-index: 6; }
@keyframes flash { from { opacity: .7; } to { opacity: 0; } }
.arena.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
.live { min-height: 66px; font-size: 13px; background: #0e0a09; border-radius: 8px; padding: 8px 10px; }
.live div { animation: pop .2s ease-out; }
.readrow { display: flex; align-items: center; gap: 8px; background: #0e0a09; border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.readrow .q { font-size: 22px; }
.tactics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tactics .btn { margin: 0; padding: 10px 4px; font-size: 14px; background: var(--panel2); border: 1px solid var(--line); line-height: 1.35; }
.tactics .btn b { display: block; font-size: 24px; }
.tactics .btn span { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.tactics .btn.good { border-color: var(--gold); box-shadow: 0 0 10px rgba(217,173,60,.3) inset; }
.rps { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; }
.gauge { position: relative; height: 34px; border-radius: 17px; background: #3a1418; overflow: hidden; margin: 12px 0; border: 1px solid var(--line); }
.gauge .ok { position: absolute; left: 27%; width: 46%; top: 0; bottom: 0; background: #7a5a16; }
.gauge .great { position: absolute; left: 43%; width: 14%; top: 0; bottom: 0; background: var(--gold2); }
.gauge .cur { position: absolute; top: -3px; bottom: -3px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 8px #fff; animation: sweep .85s linear infinite alternate; }
@keyframes sweep { from { left: 2%; } to { left: 98%; } }

/* 育成画面 */
.hero { position: relative; display: grid; grid-template-columns: 112px 1fr; gap: 6px; align-items: end; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin: 8px 0; min-height: 150px; }
.hero .arena { margin: 0; height: 150px; border: 0; border-radius: 0; }
.hero .fw { width: 92px; height: 123px; bottom: 12px; left: calc(50% - 46px); }
.hero .matfloor { bottom: -112px; }
.hero .info { padding: 10px 10px 10px 4px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; background: var(--panel); min-width: 0; }
.hero .nm { font-size: 19px; font-weight: 900; word-break: break-all; line-height: 1.2; }
.hero .st { font-size: 11px; color: var(--muted); }
.hero .age { font-size: 34px; font-weight: 900; color: var(--gold2); line-height: 1.1; }
.hero .age small { font-size: 13px; color: var(--muted); }
.life { display: flex; gap: 1.5px; margin-top: 6px; }
.life i { flex: 1; height: 7px; border-radius: 2px; background: #3a2a25; }
.life i.past { background: #7c5a50; } .life i.now { background: var(--red); box-shadow: 0 0 6px var(--red); }
.life i.oly { outline: 1px solid var(--gold); } .life i.g { background: var(--gold2); } .life i.s { background: #cfcfcf; } .life i.b { background: #c7834b; }
.delta { display: inline-block; font-size: 10px; color: #7be0a5; font-weight: 800; margin-left: 2px; animation: pop .4s; }
.delta.neg { color: #ff7b8b; }
.bar i.grow { animation: grow .7s ease-out both; }
@keyframes grow { from { width: var(--from); filter: brightness(2.2); } }

    if (a <= 14) return '中学生';
    if (a <= 17) return (g.hs === 'elite' ? '強豪高校' : '公立高校') + 'の高校生';
    if (a <= 21) return g.after === 'univ' ? '強豪大学の大学生' : g.after === 'corp' ? '実業団の選手' : '海外留学中';
    if (g.after === 'corp') return '実業団の選手';
    if (g.after === 'abroad') return '海外を拠点に戦う選手';
    return '社会人選手';
  }

  function power(g) {
    var s = g.stats;
    return (s.str + s.sta * 0.8 + s.tec * 1.3 + s.spd + s.men * 0.9) / 5;
  }
  function matchPower(g) { return power(g) * (1 - Math.max(0, g.fatigue - 50) / 150); }

  // 練習による上昇(式は仕様書4章)
  function growth(g, stat, base, fatCoef) {
    var cur = g.stats[stat];
    var gain = base * g.talent[stat] * ageCoef(g.age) * fatCoef * courseMul(g) * g.master *
      BAL.gainScale * (1 - cur / BAL.capDiv);
    gain = Math.max(0, gain);
    g.stats[stat] = clamp(cur + gain, 0, 100);
    return g.stats[stat] - cur;
  }
  function addStat(g, stat, v) { g.stats[stat] = clamp(g.stats[stat] + v, 0, 100); }
  function addFatigue(g, v) { g.fatigue = clamp(g.fatigue + v, 0, 100); }

  // ---- 幼少期 ----
  function chooseInfancy(g, id) {
    var c = INFANCY.filter(function (x) { return x.id === id; })[0];
    if (!c || g.phase !== 'infancy') return;
    var parts = [];
    for (var s in c.gain) {
      var v = c.gain[s] * g.talent[s];
      addStat(g, s, v);
      parts.push(STAT_NAMES[s] + '+' + r1(v));
    }
    g.age = 6;
    g.lastMsg = c.label + '育った。(' + parts.join('、') + ')';
    beginYear(g);
  }

  // ---- 年初イベント ----
  var RANDOM_EVENTS = [
    { id: 'master', title: '良い師匠との出会い', text: '名門クラブ出身の師匠に声をかけられた。「お前には光るものがある」\nこの1年の練習の成長が×1.3になる!',
      ok: function () { return true; }, apply: function (g) { g.master = 1.3; } },
    { id: 'cold', title: '風邪をひいた', text: '季節の変わり目にひどい風邪をひいてしまった…。\n疲労+25',
      ok: function () { return true; }, apply: function (g) { addFatigue(g, 25); } },
    { id: 'friends', title: '仲間と特訓', text: '道場の仲間と夜遅くまで打ち込みをした。\n技術+3、メンタル+2',
      ok: function () { return true; }, apply: function (g) { addStat(g, 'tec', 3); addStat(g, 'men', 2); } },
    { id: 'food', title: 'おいしいごはん', text: '家族がスタミナたっぷりの料理を作ってくれた。\n筋力+2、疲労−10',
      ok: function () { return true; }, apply: function (g) { addStat(g, 'str', 2); addFatigue(g, -10); } },
    { id: 'tv', title: 'オリンピックをテレビで観た', text: '日本代表が金メダルを取る瞬間をテレビで観た。「いつか自分も…!」\nメンタル+3',
      ok: function (g) { return g.age >= 6 && g.age <= 13; }, apply: function (g) { addStat(g, 'men', 3); } },
    { id: 'slump', title: 'スランプ', text: '何をやってもうまくいかない時期が来てしまった…。\nメンタル−3',
      ok: function (g) { return g.age >= 12; }, apply: function (g) { addStat(g, 'men', -3); } },
    { id: 'method', title: '新しいトレーニング法', text: '海外で話題の新しいトレーニング法を取り入れた。\nスピード+3',
      ok: function () { return true; }, apply: function (g) { addStat(g, 'spd', 3); } }
  ];

  // 24・28・32歳でオリンピック金メダル(3連覇)
  function threePeat(g) {
    var ages = g.medals.filter(function (m) { return m.medal === '金'; }).map(function (m) { return m.age; });
    return [24, 28, 32].every(function (a) { return ages.indexOf(a) >= 0; });
  }
  function legendBonusFor(g, t) {
    return g.age === 36 && (t.kind === 'trials' || t.kind === 'olympics') && threePeat(g) ? BAL.legendBonus : 0;
  }

  function makeEvent(g) {
    var a = g.age;
    if (a === 6) return { id: 'school', title: '小学校に入学', text: g.name + 'は小学生になった。\n体を動かすのが大好きな毎日。春・夏・秋に何をするか選ぼう。' };
    if (a === 8) return { id: 'meet', title: 'レスリングとの出会い', text: '近所の体育館で、レスリング教室の練習を見かけた。\nマットの上でぶつかり合う子どもたちの姿に、胸が熱くなる。\n' + g.name + 'はその日のうちに入門した!\n(10歳から大会に出られるようになる)' };
    if (a === 10) {
      g.rival = { name: japaneseName(), pref: pick(PREFS), w: 0, l: 0 };
      return { id: 'rival', title: '宿命のライバル出現', text: '初めての大会の会場で、ひときわ鋭い目をした同い年の選手がいた。\n' + g.rival.pref + 'の「' + g.rival.name + '」。\n「おまえには負けない」——この男とは、これから何度も戦うことになる。\n(3回戦以上ある大会の決勝では、必ずライバルと当たる)' };
    }
    if (a === 15) {
      var hs = COURSES.hs;
      return { id: 'hs', title: '進路選択:高校', text: '中学卒業。どの高校に進む?',
        options: [{ id: 'elite', label: hs.elite.name, desc: hs.elite.desc }, { id: 'public', label: hs.public.name, desc: hs.public.desc }] };
    }
    if (a === 18) {
      var af = COURSES.after;
      return { id: 'after', title: '進路選択:高校卒業後', text: '高校卒業。これからどこで強くなる?',
        options: ['univ', 'corp', 'abroad'].map(function (k) { return { id: k, label: af[k].name, desc: af[k].desc }; }) };
    }
    if (a === 36 && threePeat(g)) return { id: 'legend', title: '4連覇への挑戦', text: '24歳・28歳・32歳——オリンピック3連覇。\n世界中が「史上初の4連覇なるか」と' + g.name + 'に注目している。\n\n王者の風格に、対戦相手たちはマットに上がる前から押されている。\n(今年の代表選考会とオリンピックでは、相手が少し弱くなる)' };
    if (a >= 8 && rand() < BAL.randomEventRate) {
      var pool = RANDOM_EVENTS.filter(function (e) { return e.ok(g); });
      var e = pick(pool);
      e.apply(g);
      return { id: e.id, title: e.title, text: e.text };
    }
    return null;
  }

  function beginYear(g) {
    g.season = 0;
    g.injured = false;
    g.master = 1;
    g.yearNotes = [];
    g.tour = null;
    g.event = makeEvent(g);
    g.phase = g.event ? 'event' : 'train';
  }

  function resolveEvent(g, optionId) {
    if (g.phase !== 'event' || !g.event) return;
    var e = g.event;
    if (e.options) {
      var valid = e.options.some(function (o) { return o.id === optionId; });
      if (!valid) return;
      if (e.id === 'hs') {
        g.hs = optionId;
        g.lastMsg = COURSES.hs[optionId].name + 'に進学した!';
      } else if (e.id === 'after') {
        g.after = optionId;
        g.lastMsg = COURSES.after[optionId].name + 'の道を選んだ!';
        if (optionId === 'abroad') { addStat(g, 'men', 5); g.lastMsg += '(メンタル+5)'; }
      }
    }
    g.event = null;
    g.phase = 'train';
  }

  // ---- 練習 ----
  function train(g, menuId) {
    var m = MENU_BY_ID[menuId];
    if (!m || g.phase !== 'train') return null;
    var fc = fatigueCoef(g.fatigue);
    var parts = [];
    var gains = {};
    for (var s in m.gain) {
      var d = growth(g, s, m.gain[s], fc);
      gains[s] = d;
      parts.push(STAT_NAMES[s] + '+' + r1(d));
    }
    var before = g.fatigue;
    addFatigue(g, m.fat + (menuId === 'rest' ? 0 : courseFat(g)));
    var fd = Math.round(g.fatigue - before);
    g.lastGains = { menu: menuId, gains: gains, fat: fd };
    var msg = m.name + 'をした!' + (parts.length ? ' ' + parts.join('、') : '') + '(疲労' + (fd >= 0 ? '+' : '') + fd + ')';
    if (fc < 1) msg += '\n疲れていて、思うように身につかなかった…';
    var injured = false;
    if (menuId !== 'rest') {
      var rate = (m.injury || 0) + Math.max(0, g.fatigue - 80) / 100;
      if (rand() < rate) injured = true;
    }
    g.season++;
    if (injured) {
      g.injured = true;
      ensure(g).rec.inj++;
      msg += '\n💥 ケガをしてしまった! 残りの練習はリハビリになり、今年の大会は欠場…';
      while (g.season < 3) { addFatigue(g, -25); g.season++; }
    }
    g.lastMsg = msg;
    if (g.season >= 3) afterSeasons(g);
    return { msg: msg, injured: injured };
  }

  // ---- 大会 ----
  function tournamentFor(age) {
    if (age < 10) return null;
    var t = TOURNAMENTS[age];
    if (t) return { name: t[0], str: t[1], rounds: t[2], kind: 'normal' };
    if (OLYMPIC_AGES.indexOf(age) >= 0) return { name: 'オリンピック代表選考会', str: 67 + BAL.topBonus + (age - 24) / 4 * BAL.trialsStep, rounds: 3, kind: 'trials' };
    return { name: '全日本選手権', str: 65 + Math.min(5, age - 24), rounds: 4, kind: 'national' };
  }
  function followUp(g, t) {
    if (t.kind === 'trials') return { name: 'オリンピック', str: 68 + BAL.topBonus + (g.age - 24) / 4 * BAL.olyStep, rounds: 4, kind: 'olympics' };
    if (t.name === '全国中学大会') return { name: 'U15アジア選手権', str: t.str + 4, rounds: 4, kind: 'asia' };
    if (t.kind === 'national' || (t.name === '全日本選手権')) return { name: '世界選手権', str: t.str + 4, rounds: 4, kind: 'world' };
    return null;
  }
  function isIntl(t) { return t.kind === 'world' || t.kind === 'olympics' || t.kind === 'asia'; }

  function roundName(r, R) {
    if (r === R) return '決勝';
    if (r === R - 1) return '準決勝';
    if (r === R - 2) return '準々決勝';
    return r + '回戦';
  }

  function makeOpponent(g, t, r) {
    var S = t.str * BAL.oppScale - legendBonusFor(g, t);
    var isFinal = r === t.rounds;
    if (isFinal && t.rounds >= 3) {
      var p = S + 4 + rnd(-2.5, 2.5);
      if (!isIntl(t) && g.rival) return { name: g.rival.name, from: g.rival.pref, power: p, rival: true };
      var fn = foreignName(t.kind === 'asia');
      return { name: fn.name, from: fn.country, power: p, champ: t.kind === 'asia' ? 'アジア王者' : '世界王者' };
    }
    var pw = S - (t.rounds - r) * 3 + rnd(-3, 3);
    if (isIntl(t)) { var f = foreignName(t.kind === 'asia'); return { name: f.name, from: f.country, power: pw }; }
    return { name: japaneseName(), from: pick(PREFS), power: pw };
  }

  function myMoves(g) { return MOVES.filter(function (m) { return g.stats.tec >= m.tec; }); }
  function oppMoves(p) { return MOVES.filter(function (m) { return p >= m.tec * 0.9; }); }
  // 得点を技の場面に分ける(5点の大技、4点の投げ・持ち上げ、2点のテイクダウンや返し技、1点の押し出し)
  function narrate(pts, moves, who) {
    var lines = [];
    function of(n) { return moves.filter(function (m) { return m.pts === n; }); }
    var m5 = of(5), m4 = of(4), m2 = of(2);
    while (pts > 0) {
      var mv;
      if (pts >= 5 && m5.length && rand() < 0.3) mv = pick(m5);
      else if (pts >= 4 && m4.length && rand() < 0.4) mv = pick(m4);
      else if (pts >= 2) mv = rand() < 0.4 ? m2[m2.length - 1] : pick(m2);   // 覚えたての技は出やすい
      else mv = rand() < 0.3 ? { name: 'アクティビティタイム', pts: 1 } : { name: '場外押し出し', pts: 1 };
      lines.push({ who: who, move: mv.name, pts: mv.pts });
      pts -= mv.pts;
    }
    return lines;
  }

  // ---- 試合(1ピリオドずつ、作戦を選んで進める) ----
  // 作戦は3すくみ: 攻め(atk)は 守り型(def)に強い / カウンター(ctr)は 攻め型(atk)に強い / 守り(def)は カウンター型(ctr)に強い
  var TACTICS = [
    { id: 'atk', name: 'ガンガン攻める', short: '攻め', beats: 'def', desc: '守りを固める相手を崩す' },
    { id: 'ctr', name: 'カウンター狙い', short: 'カウンター', beats: 'atk', desc: '攻めてくる相手の力を利用する' },
    { id: 'def', name: '守りを固める', short: '守り', beats: 'ctr', desc: 'カウンター狙いの相手にスキを与えない' }
  ];
  var TACTIC_BY_ID = {};
  TACTICS.forEach(function (t) { TACTIC_BY_ID[t.id] = t; });
  var STYLE_NAMES = { atk: '攻め型', ctr: 'カウンター型', def: '守り型' };
  function tacticEdge(my, style) {
    if (TACTIC_BY_ID[my].beats === style) return 1;
    if (TACTIC_BY_ID[style].beats === my) return -1;
    return 0;
  }

  function startTournament(g, t) {
    g.tour = { name: t.name, kind: t.kind, str: t.str, rounds: t.rounds, r: 0, matches: [], won: false, over: false, sum: false,
      intro: true, place: '', medal: null, next: null, cur: null, bronze: false };
    g.tourStep = 0;
    g.phase = 'tournament';
  }

  // 次の試合の相手を決める
  function prepareMatch(g) {
    var t = g.tour;
    if (!t || t.over || (t.cur && !t.cur.done)) return;
    t.intro = false;
    var opp, round;
    if (t.bronze) {
      var bf = foreignName();
      opp = { name: bf.name, from: bf.country, power: t.str * BAL.oppScale - 3 + rnd(-2, 2) };
      round = '3位決定戦';
    } else {
      t.r++;
      opp = makeOpponent(g, t, t.r);
      round = roundName(t.r, t.rounds);
    }
    var P = matchPower(g);
    var diff = P - opp.power;
    var fall = null;
    if (Math.abs(diff) > 20 && rand() < 0.2) fall = { period: ri(1, 2), by: diff > 0 ? 'me' : 'opp' };
    var style = pick(['atk', 'ctr', 'def']);
    t.cur = {
      round: round,
      opp: { name: opp.name, from: opp.from, power: Math.round(opp.power), rival: !!opp.rival, champ: opp.champ || '', style: style,
        hidden: !!(opp.rival || opp.champ) },
      oppPower: opp.power, myPower: Math.round(P), diff: diff, fall: fall,
      periods: [], me: 0, op: 0, done: false, tie: false, win: false, method: ''
    };
  }

  // 1ピリオド戦う
  function playPeriod(g, tactic) {
    var t = g.tour, m = t && t.cur;
    if (!m || m.done || m.tie || m.periods.length >= 2 || !TACTIC_BY_ID[tactic]) return null;
    var pn = m.periods.length + 1;
    // 古いセーブデータで、すでに10点差がついている試合はその場で終了
    if (Math.abs(m.me - m.op) >= TECH_GAP) {
      m.tech = true; m.fall = null;
      finishMatch(g, m.me > m.op, m.me > m.op ? 'テクニカルスペリオリティ勝ち' : 'テクニカルスペリオリティ負け');
      return { me: 0, opp: 0, lines: [], tactic: tactic, style: m.opp.style, edge: 0, switched: false };
    }
    // 第2ピリオドは相手が作戦を変えてくることがある
    var switched = false;
    if (pn === 2 && rand() < BAL.styleSwitch) {
      var others = ['atk', 'ctr', 'def'].filter(function (x) { return x !== m.opp.style; });
      m.opp.style = pick(others);
      switched = true;
    }
    var edge = tacticEdge(tactic, m.opp.style);
    var d = m.diff + edge * BAL.tactic;
    var a = Math.max(0, Math.round(2 + d / 7 + rnd(-2.5, 2.5)));
    var b = Math.max(0, Math.round(2 - d / 7 + rnd(-2.5, 2.5)));
    var lines = narrate(a, myMoves(g), 'me').concat(narrate(b, oppMoves(m.oppPower), 'opp'));
    for (var i = lines.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var tmp = lines[i]; lines[i] = lines[j]; lines[j] = tmp; }
    // 10点差がついた瞬間に試合終了(テクニカルスペリオリティ)
    var tech = false, sa = 0, sb = 0;
    for (var k = 0; k < lines.length; k++) {
      if (lines[k].who === 'me') sa += lines[k].pts; else sb += lines[k].pts;
      if (Math.abs((m.me + sa) - (m.op + sb)) >= TECH_GAP) { tech = true; lines = lines.slice(0, k + 1); a = sa; b = sb; break; }
    }
    m.me += a; m.op += b;
    var per = { me: a, opp: b, lines: lines, tactic: tactic, style: m.opp.style, edge: edge, switched: switched };
    m.periods.push(per);
    m.opp.hidden = false;
    if (tech) {
      m.tech = true; m.fall = null;
      finishMatch(g, m.me > m.op, m.me > m.op ? 'テクニカルスペリオリティ勝ち' : 'テクニカルスペリオリティ負け');
    } else if (m.fall && m.fall.period === pn) {
      finishMatch(g, m.fall.by === 'me', m.fall.by === 'me' ? 'フォール勝ち' : 'フォール負け');
    } else if (pn === 2) {
      if (m.me !== m.op) finishMatch(g, m.me > m.op, m.me > m.op ? '判定勝ち' : '判定負け');
      else m.tie = true;
    }
    return per;
  }

  // 同点のとき: 最後の1ポイント勝負。quality は ミニゲームの出来('great' / 'ok' / 'miss')。'auto' は自動
  function resolveTie(g, quality) {
    var t = g.tour, m = t && t.cur;
    if (!m || m.done || !m.tie) return;
    var pw = clamp(0.5 + m.diff / 100 + (g.stats.men - 50) / 200, 0.1, 0.9);
    if (quality === 'great') pw = Math.max(pw, 0.9);
    else if (quality === 'miss') pw = Math.min(pw, 0.2);
    var win = rand() < pw;
    m.tie = false;
    m.tieQuality = quality;
    finishMatch(g, win, win ? '同点・ラストポイントで勝ち' : '同点・ラストポイントで負け');
  }

  function finishMatch(g, win, method) {
    var t = g.tour, m = t.cur;
    m.done = true; m.win = win; m.method = method;
    addStat(g, 'men', win ? 0.6 : 0.3);
    var rec = ensure(g).rec;
    rec.matches++;
    if (win) rec.wins++;
    if (m.fall && win) rec.falls++;
    if (m.tech && win) rec.techs = (rec.techs || 0) + 1;
    if (m.opp.rival && g.rival) { if (win) g.rival.w++; else g.rival.l++; }
    t.matches.push(m);
    var R = t.rounds, oly = t.kind === 'olympics';
    if (t.bronze) {
      t.bronze = false; t.over = true;
      if (win) { t.medal = '銅'; t.place = '銅メダル'; } else t.place = '4位';
    } else if (!win) {
      if (oly && t.r === R - 1) t.bronze = true;
      else {
        t.over = true;
        if (t.r === R) { t.place = oly ? '銀メダル' : '準優勝'; if (oly) t.medal = '銀'; }
        else if (t.r === R - 1) t.place = 'ベスト4';
        else t.place = m.round + '敗退';
      }
    } else if (t.r === R) {
      t.over = true; t.won = true;
      t.place = oly ? '金メダル' : '優勝';
      if (oly) t.medal = '金';
    }
    if (t.over) {
      if (t.won) g.titles.push({ age: g.age, name: t.name });
      if (t.medal) g.medals.push({ age: g.age, medal: t.medal });
      if (isIntl(t) || t.won) g.log.push({ age: g.age, name: t.name, place: t.place });
      t.next = t.won ? followUp(g, t) : null;
    }
  }

  // 試合結果を見たあと「つぎへ」
  function advanceTournament(g) {
    var t = g.tour;
    if (!t || g.phase !== 'tournament') return;
    if (t.intro) { prepareMatch(g); return; }
    if (t.cur && !t.cur.done) return;
    if (t.over) { t.sum = true; t.cur = null; return; }
    prepareMatch(g);
  }

  // 自動プレイ用: 大会を最後まで進める。chooser(g, 試合) が作戦を返す
  function autoTournament(g, chooser) {
    var guard = 0;
    while (g.phase === 'tournament' && g.tour && !g.tour.sum && guard++ < 200) {
      var m = g.tour.cur;
      if (m && !m.done) {
        if (m.tie) resolveTie(g, 'auto');
        else playPeriod(g, chooser ? chooser(g, m) : 'atk');
      } else advanceTournament(g);
    }
  }
  // 相手の型が見えていれば有利な作戦、見えなければ攻め
  function smartTactic(g, m) {
    if (m.opp.hidden) return 'atk';
    return TACTICS.filter(function (x) { return x.beats === m.opp.style; })[0].id;
  }

  function afterSeasons(g) {
    var t = tournamentFor(g.age);
    if (t && !g.injured) {
      startTournament(g, t);
    } else {

    { id: 'fall10', ic: '💥', n: 'フォールの鬼', d: 'フォール勝ちを10回', t: function () { return g.rec.falls >= 10; } },
    { id: 'win100', ic: '💯', n: '通算100勝', d: '試合に100回勝つ', t: function () { return g.rec.wins >= 100; } },
    { id: 'iron', ic: '🦾', n: '鉄人', d: '一度もケガをせずに引退', t: function () { return retired() && g.rec.inj === 0; } },
    { id: 'p80', ic: '📈', n: '世界レベル', d: '戦闘力80に到達', t: function () { return WL.power(g) >= 80; } },
    { id: 'p90', ic: '🚀', n: '人類最強クラス', d: '戦闘力90に到達', t: function () { return WL.power(g) >= 90; } },
    { id: 'suplex', ic: '🌀', n: 'スープレックス習得', d: '技術を90まで上げる', t: function () { return g.stats.tec >= 90; } },
    { id: 'titles20', ic: '🏅', n: 'タイトルホルダー', d: '優勝を20回', t: function () { return g.titles.length >= 20; } },
    { id: 'lives5', ic: '♻️', n: '輪廻転生', d: '5回の人生を最後まで生きる', t: function () { return jsonGet(HALL_KEY, []).length >= 5; } }
  ];
  function toast(html) {
    var box = document.getElementById('toasts');
    var d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html;
    box.appendChild(d); setTimeout(function () { d.remove(); }, 3500);
  }
  function checkAch() {
    if (!g || g.age < 6) return;
    var got = jsonGet(ACH_KEY, {}), news = [];
    ACHS.forEach(function (a) { if (!got[a.id]) { var ok = false; try { ok = a.t(); } catch (e) {} if (ok) { got[a.id] = Date.now(); news.push(a); } } });
    if (news.length) {
      storeSet(ACH_KEY, JSON.stringify(got));
      news.forEach(function (a, i) { setTimeout(function () { toast(a.ic + ' 実績解除:' + esc(a.n)); SFX.unlock(); }, 500 + i * 900); });
    }
  }

  // ---- 殿堂 ----
  function honorAny(x) {
    x = x || g;
    var gs = goldsOf(x);
    if (gs.length) return honorTitle();
    if (x.medals.some(function (m) { return m.medal === '銀'; })) return 'あと一歩に迫った銀メダリスト';
    if (x.medals.some(function (m) { return m.medal === '銅'; })) return '誇り高き銅メダリスト';
    if (x.titles.some(function (t) { return t.name === '世界選手権'; })) return '無冠の世界王者';
    if (x.log.some(function (l) { return l.name === 'オリンピック'; })) return 'オリンピアン';
    if (x.titles.some(function (t) { return t.name === '全日本選手権'; })) return '日本王者';
    if (x.titles.length >= 5) return '名選手';
    return '不屈の挑戦者';
  }
  function recordHall() {
    var hall = jsonGet(HALL_KEY, []);
    if (hall.some(function (h) { return h.id === g.id; })) return;
    var c = function (k) { return g.medals.filter(function (m) { return m.medal === k; }).length; };
    var world = countTitle('世界選手権');
    var e = { id: g.id, name: g.name, pref: g.pref, age: g.ending.age, gold: c('金'), silver: c('銀'), bronze: c('銅'), world: world, titles: g.titles.length,
      rw: g.rival ? g.rival.w : 0, rl: g.rival ? g.rival.l : 0, wins: g.rec.wins, matches: g.rec.matches, peak: g.rec.peak, honor: honorAny(), date: Date.now() };
    e.score = e.gold * 1000 + e.silver * 300 + e.bronze * 150 + world * 80 + e.titles * 10 + e.peak;
    hall.push(e);
    hall.sort(function (a, b) { return b.score - a.score; });
    storeSet(HALL_KEY, JSON.stringify(hall.slice(0, 50)));
  }

  // ---- 描画 ----
  function render() {
    animToken++; skipAnim = false;
    save();
    var html;
    if (!g) html = view === 'hall' ? hallScreen() : view === 'ach' ? achScreen() : titleScreen();
    else switch (g.phase) {
      case 'birth': html = birthScreen(); break;
      case 'infancy': html = infancyScreen(); break;
      case 'event': html = eventScreen(); break;
      case 'train': html = trainScreen(); break;
      case 'tournament': html = tournamentScreen(); break;
      case 'yearEnd': html = yearEndScreen(); break;
      case 'ending': html = endingScreen(); break;
      default: html = titleScreen();
    }
    app.innerHTML = '<div class="pop">' + html + '</div>';
    window.scrollTo(0, 0);
    document.getElementById('soundBtn').textContent = settings.sound ? '🔊' : '🔇';
    checkAch();
    afterRender();
  }
  function afterRender() {
    var c = document.getElementById('shareCanvasHost');
    if (c) drawShareCard();
  }

  // ---- 1. タイトル ----
  function titleScreen() {
    var saved = load();
    var ok = resumable(saved);
    var last = storeGet(NAME_KEY) || '';
    var got = Object.keys(jsonGet(ACH_KEY, {})).length;
    var hall = jsonGet(HALL_KEY, []);
    return '<div class="logo"><div class="en">WRESTLING LIFE</div><h1>レスリング人生</h1><div class="road">〜オリンピックへの道〜</div></div>' +
      '<div class="arena olympics"><div class="beam l"></div><div class="beam r"></div><div class="matfloor"></div>' +
      fwrap('a', fig({ pose: 'stance', color: '#d31f3c' }), 'bob') + fwrap('b', fig({ pose: 'stance', color: '#2456c9' }), 'bob') + '</div>' +
      '<div class="card"><div class="label">選手の名前</div>' +
      '<input type="text" id="nameInput" maxlength="12" placeholder="例:田中 レス太郎" value="' + esc(last) + '">' +
      '<button class="btn" data-act="new">はじめから</button>' +
      '<button class="btn gold" data-act="continue"' + (ok ? '' : ' disabled') + '>つづきから' + (ok ? '(' + esc(saved.name) + '・' + saved.age + '歳)' : '') + '</button>' +
      '<div class="minirow"><button class="btn" data-act="hall"><b>🏛</b>殿堂 ' + hall.length + '</button><button class="btn" data-act="ach"><b>🎖</b>実績 ' + got + '/' + ACHS.length + '</button>' +
      '<button class="btn" data-act="help"><b>❓</b>遊び方</button><button class="btn" data-act="speed"><b>' + (settings.fast ? '⏩' : '▶️') + '</b>試合' + (settings.fast ? '高速' : '標準') + '</button></div></div>' +
      '<div class="card small muted">生まれてから36歳まで。練習で鍛え、試合では相手の出方を読んで作戦を選ぶ。<br>めざすはオリンピックの金メダル!</div>';
  }
  function helpOverlay() {
    return '<div class="overlay" data-act="closeHelp"><div class="card gold"><h2>遊び方</h2>' +
      '<h3 style="margin-top:10px">① 育てる</h3><p class="small">毎年「春・夏・秋」の3回、練習を選ぶ。疲労がたまると伸びが悪くなり、80を超えるとケガをしやすい。大会の前は休養して疲れを抜こう。</p>' +
      '<h3>② 試合で作戦を選ぶ</h3><p class="small">試合は2ピリオド(10点差がつくとその場で終了)。ピリオドごとに作戦を1つ選ぶ。作戦は3すくみ:</p>' +
      '<p class="small">⚔️ <b>攻め</b> は 🛡 守り型 に勝つ<br>🌀 <b>カウンター</b> は ⚔️ 攻め型 に勝つ<br>🛡 <b>守り</b> は 🌀 カウンター型 に勝つ</p>' +
      '<p class="small">つまり <b>攻め ▶ 守り ▶ カウンター ▶ 攻め</b> のじゃんけん。相手の型に勝つ作戦を選ぼう。</p>' +
      '<p class="small">相手の型は表示されるが、ライバルや王者は第1ピリオドが終わるまで分からない。第2ピリオドで作戦を変えてくる相手もいる。</p>' +
      '<h3>得点とテクニカルスペリオリティ</h3><p class="small">押し出し1点、タックル・バックポイント・返し技2点、投げ技・持ち上げタックル4点、スープレックス5点。技術を上げると使える技が増える。<b>10点差</b>がつくと、その場で試合終了(テクニカルスペリオリティ)。</p>' +
      '<h3>③ 同点なら一発勝負</h3><p class="small">ゲージが金色の真ん中に来た瞬間に「今だ!」を押すと、ラストポイントを取りやすい。</p>' +
      '<h3>④ ゴール</h3><p class="small">24・28・32・36歳のオリンピックで金メダル。取ったあとも現役を続けて連覇をねらえる。結果は「殿堂」に残る。</p>' +
      '<button class="btn" data-act="closeHelp">とじる</button></div></div>';
  }
  function hallScreen() {
    var hall = jsonGet(HALL_KEY, []);
    var rows = hall.map(function (h, i) {
      var medals = '🥇'.repeat(Math.min(h.gold, 4)) + '🥈'.repeat(Math.min(h.silver, 3)) + '🥉'.repeat(Math.min(h.bronze, 3));
      return '<div class="hallrow"><div class="rk">' + (i + 1) + '</div><div><div class="hn">' + esc(h.name) + ' <span class="tag gold">' + esc(h.honor) + '</span></div>' +
        '<div class="hd">' + esc(h.pref) + '・' + h.age + '歳で引退・優勝' + h.titles + '回・世界' + h.world + '回・' + h.wins + '勝' + (h.matches - h.wins) + '敗・最高戦闘力' + h.peak + '</div></div>' +
        '<div class="hm">' + (medals || '—') + '</div></div>';
    }).join('');
    var golds = hall.filter(function (h) { return h.gold > 0; }).length;
    return '<div class="card gold"><h2>🏛 殿堂</h2><p class="small muted">これまでに生きた人生の記録(この端末に保存)。' + hall.length + '人中、金メダリスト' + golds + '人。</p>' +
      (rows || '<p class="center muted">まだ記録がありません。<br>最初の人生を最後まで生きてみよう。</p>') + '</div>' +
      '<button class="btn" data-act="back">もどる</button>';
  }
  function achScreen() {
    var got = jsonGet(ACH_KEY, {});
    return '<div class="card gold"><h2>🎖 実績 ' + Object.keys(got).length + '/' + ACHS.length + '</h2><div class="achs" style="margin-top:10px">' +
      ACHS.map(function (a) { return '<div class="ach ' + (got[a.id] ? 'on' : '') + '"><span class="ic">' + (got[a.id] ? a.ic : '🔒') + '</span><b>' + esc(a.n) + '</b>' + esc(a.d) + '</div>'; }).join('') +
      '</div></div><button class="btn" data-act="back">もどる</button>';
  }

  // ---- 2. 誕生 ----
  function birthScreen() {
    var rows = WL.STATS.map(function (s) {
      return '<li>' + WL.STAT_NAMES[s] + ' <span class="gold-t">' + starStr(WL.stars(g.talent[s])) + '</span></li>';
    }).join('');
    return '<div class="center" style="padding-top:14px">' + babyFig() + '<h2>おめでとうございます!</h2></div>' +
      '<div class="card"><div class="big center">' + esc(g.name) + '</div>' +
      '<p class="center">' + esc(g.pref) + 'で元気な赤ちゃんが生まれた!</p>' +
      '<div class="label">生まれつきの才能(★が多いほど伸びやすい)</div><ul class="plain">' + rows + '</ul></div>' +
      '<button class="btn" data-act="toInfancy">すくすく育つ</button>';
  }

  // ---- 3. 幼少期 ----
  function infancyScreen() {
    var ic = { outdoor: '🌳', grapple: '🤼', books: '📚' };
    return '<div class="center">' + babyFig() + '</div><div class="card"><div class="label">0〜5歳</div><h2>どんなふうに育てる?</h2>' +
      '<p class="muted small">幼いころの過ごし方で、得意なことが変わる。</p>' +
      WL.INFANCY.map(function (c) {
        return '<button class="btn choice" data-act="infancy" data-id="' + c.id + '"><b>' + ic[c.id] + ' ' + esc(c.label) + '</b><span>' + esc(c.desc) + '</span></button>';
      }).join('') + '</div>';
  }

  // ---- 共通: 主人公のカード ----
  function sceneClass() { return g.age < 8 ? 'park' : g.age < 16 ? 'dojo' : ''; }
  function lifeStrip() {
    var html = '';
    for (var a = 6; a <= 36; a++) {
      var md = g.medals.filter(function (m) { return m.age === a; })[0];
      var cls = a === g.age ? 'now' : a < g.age ? 'past' : '';
      if (WL.OLYMPIC_AGES.indexOf(a) >= 0) cls += ' oly';
      if (md) cls += md.medal === '金' ? ' g' : md.medal === '銀' ? ' s' : ' b';
      html += '<i class="' + cls + '"></i>';
    }
    return '<div class="life" title="6歳〜36歳">' + html + '</div>';
  }
  function hero(pose) {
    var c = myColors();
    var tired = g.fatigue > 65;
    var p = pose || (tired ? 'tired' : 'idle');
    var nextOly = WL.OLYMPIC_AGES.filter(function (a) { return a >= g.age; })[0];
    return '<div class="hero"><div class="arena ' + sceneClass() + '"><div class="matfloor"></div>' +
      fwrap('solo', fig({ pose: p, color: c.color, age: g.age, sweat: tired, bandage: g.injured, medal: goldsOf(g).length > 0 }), 'bob') + '</div>' +
      '<div class="info"><div class="nm">' + esc(g.name) + '</div><div class="st">' + esc(WL.stageName(g)) + '・' + esc(g.pref) + '出身</div>' +
      '<div class="age">' + g.age + '<small>歳' + (nextOly ? (nextOly === g.age ? ' 🏅オリンピックの年!' : ' 次の五輪まで' + (nextOly - g.age) + '年') : '') + '</small></div>' + lifeStrip() + '</div></div>';
  }
  function statsPanel(showDelta) {
    var lg = showDelta && fresh && g.lastGains ? g.lastGains : null;
    var html = WL.STATS.map(function (s) {
      var v = g.stats[s];
      var d = lg && lg.gains[s] ? lg.gains[s] : 0;
      return '<div class="stat"><div class="nm">' + WL.STAT_NAMES[s] + '<small>' + starStr(WL.stars(g.talent[s])) + '</small></div>' +
        '<div class="bar"><i' + (d ? ' class="grow" style="--from:' + (v - d) + '%;width:' + v + '%"' : ' style="width:' + v + '%"') + '></i></div>' +
        '<div class="v">' + n0(v) + (d ? '<span class="delta">+' + (Math.round(d * 10) / 10) + '</span>' : '') + '</div></div>';
    }).join('');
    var f = g.fatigue;
    var fd = lg ? lg.fat : 0;
    var fl = f > 85 ? '<span class="red-t">限界</span>' : f > 65 ? '<span class="red-t">ヘトヘト</span>' : f > 50 ? '<span class="gold-t">疲れぎみ</span>' : '<span class="green-t">元気</span>';
    html += '<div class="stat"><div class="nm">疲労</div><div class="bar fat"><i' + (fd ? ' class="grow" style="--from:' + (f - fd) + '%;width:' + f + '%"' : ' style="width:' + f + '%"') + '></i></div>' +
      '<div class="v">' + n0(f) + (fd ? '<span class="delta ' + (fd > 0 ? 'neg' : '') + '">' + (fd > 0 ? '+' : '') + fd + '</span>' : '') + '</div></div>';
    html += '<div class="power"><span>戦闘力 <b class="gold-t">' + n0(WL.power(g)) + '</b>' +
      (f > 50 ? '(試合では ' + n0(WL.matchPower(g)) + ')' : '') + '</span><span>' + fl + '</span></div>';
    if (g.rival) html += '<div class="small muted">ライバル ' + esc(g.rival.name) + ':' + g.rival.w + '勝' + g.rival.l + '敗</div>';
    return '<div class="card">' + html + '</div>';
  }

  // ---- 4. 年初イベント ----
  function eventScreen() {
    var e = g.event;
    var body = '<div class="card ' + (e.options ? 'gold' : 'red') + '"><div class="label">' + g.age + '歳の年のはじめ</div>' +
      '<h2>' + esc(e.title) + '</h2><p style="white-space:pre-line">' + esc(e.text) + '</p>';
    if (e.options) {
      body += e.options.map(function (o) {
        return '<button class="btn choice" data-act="event" data-id="' + esc(o.id) + '"><b>' + esc(o.label) + '</b><span>' + esc(o.desc) + '</span></button>';
      }).join('');
    } else {
      body += '<button class="btn" data-act="event" data-id="">練習へ</button>';
    }
    return hero() + (g.lastMsg && !e.options ? '<div class="msg">' + esc(g.lastMsg) + '</div>' : '') + body + '</div>';
  }

  // ---- 5. 練習 ----
  var MENU_ICON = { muscle: '💪', run: '🏃', tech: '🤼', dash: '⚡', spar: '🥊', mind: '🧘', rest: '😴' };
  function trainScreen() {
    var t = WL.tournamentFor(g.age);
    var names = ['春', '夏', '秋'];
    var seasons = names.map(function (n, i) {
      return '<div class="' + (i < g.season ? 'done' : i === g.season ? 'now' : '') + '">' + n + '</div>';
    }).join('') + '<div class="tour">冬・大会</div>';
    var tourLine = t ? '今年の大会:<b class="gold-t">' + esc(t.name) + '</b>(全' + t.rounds + '試合)' +
      (t.kind === 'trials' ? '<span class="tag gold">五輪イヤー</span>' : '') : '今年は大会なし';
    var menus = WL.MENUS.map(function (m) {
      var gains = Object.keys(m.gain).map(function (s) { return WL.STAT_NAMES[s] + '+' + m.gain[s]; }).join(' ');
      var fat = m.fat + (m.id === 'rest' ? 0 : WL.courseFat(g));
      return '<button class="btn ' + m.id + '" data-act="train" data-id="' + m.id + '"><em>' + MENU_ICON[m.id] + '</em><b>' + esc(m.name) + '</b><span>' +
        (gains || '疲れをとる') + '</span><span>疲労' + (fat > 0 ? '+' : '') + fat + (m.injury ? '・ケガ注意' : '') + '</span></button>';
    }).join('');
    var tips = [];
    if (g.master > 1) tips.push('師匠の指導で今年の成長×' + g.master);
    if (g.season === 2 && t && g.fatigue > 50) tips.push('大会前に疲れを抜いておくと試合で力を出せる');
    if (g.fatigue > 80) tips.push('疲労80超はケガをしやすい!');
    else if (g.fatigue > 65) tips.push('疲労65超は練習の伸びが落ちる');
    return hero() +
      '<div class="seasons">' + seasons + '</div>' +
      '<div class="small">' + tourLine + '</div>' +
      statsPanel(true) +
      (g.lastMsg ? '<div class="msg">' + esc(g.lastMsg) + '</div>' : '') +
      (tips.length ? '<div class="small gold-t">💡 ' + tips.map(esc).join('<br>💡 ') + '</div>' : '') +
      '<div class="label" style="margin-top:8px">' + names[g.season] + 'の練習メニューを選ぶ</div>' +
      '<div class="menus">' + menus + '</div>' +
      '<button class="btn ghost" data-act="toTitle" style="margin-top:18px">タイトルへ(自動でセーブされています)</button>';
  }

  // ---- 6. 大会 ----
  var TACTIC_ICON = { atk: '⚔️', ctr: '🌀', def: '🛡' };
  var STYLE_ICON = { atk: '⚔️', ctr: '🌀', def: '🛡' };
  function lineText(l, oppName) {
    var who = l.who === 'me' ? esc(g.name) : esc(oppName);
    if (l.move === 'アクティビティタイム') return '<div class="' + (l.who === 'me' ? 'gold-t' : 'muted') + '">' + who + 'に1点! 相手が消極的(アクティビティタイム)</div>';

  function tourHead(t) {
    return '<div class="card ' + (t.kind === 'olympics' ? 'gold' : 'red') + ' center" style="padding:8px"><div class="label">' + g.age + '歳の冬</div>' +
      '<h2 style="font-size:19px">' + (t.kind === 'olympics' ? '🏅 ' : t.kind === 'world' || t.kind === 'asia' ? '🌏 ' : '🏆 ') + esc(t.name) + '</h2></div>';
  }
  // 試合会場。sm/so は表示する得点、poseA/poseB は立ち姿
  function arenaHTML(t, m, sm, so, pn, opt) {
    opt = opt || {};
    var o = m.opp, oc = oppColors(o), mc = myColors();
    return '<div class="arena ' + (t.kind === 'olympics' ? 'olympics' : '') + '" id="arena"><div class="beam l"></div><div class="beam r"></div><div class="matfloor"></div>' +
      '<div class="sb"><div class="t me"><span class="n">' + esc(g.name) + '</span><span class="s" id="sm">' + sm + '</span></div>' +
      '<div class="mid">' + esc(m.round) + '<b id="pd">' + (pn ? '第' + pn + 'P' : '—') + '</b></div>' +
      '<div class="t op ' + (o.rival ? 'rival' : o.champ ? 'champ' : '') + '"><span class="n">' + esc(o.name) + '</span><span class="s" id="so">' + so + '</span></div></div>' +
      fwrap('a', fig({ pose: opt.poseA || 'stance', color: mc.color, age: g.age }), opt.clsA || 'bob') +
      fwrap('b', fig({ pose: opt.poseB || 'stance', color: oc.color, trim: oc.trim, age: g.age }), opt.clsB || 'bob') +
      (opt.banner || '') + '</div>';
  }
  function oppCard(m) {

        '<p class="small muted">続けると36歳まで挑戦できます。31歳からは体が衰えるので、勝ち続けるのは簡単ではありません。</p></div>' +
        '<button class="btn gold" data-act="goldContinue">現役を続ける(' + (a + 4) + '歳で' + (n >= 1 ? (n + 1) + '個目の金' : '金') + 'をねらう)</button>' +
        '<button class="btn" data-act="goldRetire">ここで引退する</button>';
    } else {
      html += '<p>36歳。最後のオリンピックで頂点に立った。<br>' + esc(g.name) + 'の現役生活は、最高の形で幕を閉じる。</p></div>' +
        '<button class="btn gold" data-act="goldRetire">現役を終える</button>';
    }
    return html;
  }

  function endingScreen() {
    var gold = g.ending.type === 'gold';
    if (gold) {
      var scenes = goldScenes();
      var i = g.ending.scene || 0;
      if (!g.ending.done) return i < scenes.length ? goldSceneScreen(scenes, i) : goldChoiceScreen();
    }
    recordHall();
    var gs = golds();
    var lastGold = gs.length ? gs[gs.length - 1].age : 0;
    var top = gold
      ? confetti() + '<div class="endfig">' + fig({ pose: 'win', color: '#d31f3c', age: Math.min(g.ending.age, 36), medal: true }) + '</div><h1 class="center gold-t" style="font-size:24px">オリンピック金メダル' + (gs.length >= 2 ? gs.length + '個!' : '!') + '</h1><p class="center">' +
        (gs.length >= 2 || g.ending.age > lastGold ? gs.map(function (m) { return m.age + '歳'; }).join('・') + 'で金メダル!<br>' + esc(g.name) + 'は' + g.ending.age + '歳で現役を引退した。' :
          g.ending.age + '歳、' + esc(g.name) + 'はついに世界の頂点に立った!') + '</p><div class="center"><span class="honor">' + esc(honorTitle()) + '</span></div>'
      : '<div class="endfig">' + fig({ pose: 'idle', color: '#d31f3c', age: 36 }) + '</div><h1 class="center">引退</h1><p class="center">' + g.ending.age + '歳。' + esc(g.name) + 'は静かにマットを降りた。<br>金メダルには届かなかったが、その挑戦は多くの人の心に残った。</p><div class="center"><span class="honor">' + esc(honorAny()) + '</span></div>';
    var tnames = [], tmap = {};
    g.titles.forEach(function (t) { if (!tmap[t.name]) { tmap[t.name] = []; tnames.push(t.name); } tmap[t.name].push(t.age); });
    var titles = tnames.length ? tnames.map(function (n) {
      var a = tmap[n];
      return '<li>' + esc(n) + (a.length > 1 ? ' <b>×' + a.length + '</b>' : '') + ' <span class="muted small">' + (a.length > 6 ? a[0] + '〜' + a[a.length - 1] + '歳' : a.join('・') + '歳') + '</span></li>';
    }).join('') : '<li class="muted">なし</li>';
    var medals = g.medals.length ? g.medals.map(function (m) { return '<li>' + m.age + '歳 オリンピック ' + ({ '金': '🥇金', '銀': '🥈銀', '銅': '🥉銅' })[m.medal] + 'メダル</li>'; }).join('') : '<li class="muted">なし</li>';
    var oly = g.log.filter(function (l) { return l.name === '世界選手権' || l.name === 'U15アジア選手権' || (l.name === 'オリンピック' && l.place.indexOf('メダル') < 0); });
    return '<div class="card ' + (gold ? 'gold' : '') + '" style="position:relative;overflow:hidden">' + top + '</div>' +
      '<div class="card"><h3>🏅 メダル</h3><ul class="plain">' + medals + '</ul>' +
      (oly.length ? '<h3>🌏 国際大会</h3><ul class="plain">' + oly.map(function (l) { return '<li>' + l.age + '歳 ' + esc(l.name) + ' ' + esc(l.place) + '</li>'; }).join('') + '</ul>' : '') +
      '<h3>🏆 優勝歴(' + g.titles.length + '回)</h3><ul class="plain">' + titles + '</ul>' +
      (g.rival ? '<h3>⚔️ ライバル ' + esc(g.rival.name) + '</h3><p>通算 ' + g.rival.w + '勝' + g.rival.l + '敗</p>' : '') + '</div>' +
      statsPanel(false) + endingExtras() +
      '<button class="btn gold" data-act="reborn">生まれ変わる</button>';
  }

  // ---- エンディングの追加パーツ(戦闘力の歩み・通算成績・結果カード) ----
  function powerChart() {
    var h = g.hist || [];
    if (h.length < 3) return '';
    var W = 320, H = 120, x0 = 22, y0 = 100;
    var maxP = Math.max(100, Math.max.apply(null, h.map(function (p) { return p.p; })));
    function X(a) { return x0 + (a - 6) / 30 * (W - x0 - 20); }
    function Y(p) { return y0 - p / maxP * 88; }
    var pts = h.map(function (p) { return X(p.a).toFixed(1) + ',' + Y(p.p).toFixed(1); }).join(' ');
    var marks = WL.OLYMPIC_AGES.map(function (a) {
      var md = g.medals.filter(function (m) { return m.age === a; })[0];
      return '<line x1="' + X(a) + '" y1="10" x2="' + X(a) + '" y2="' + y0 + '" stroke="#5a4a22" stroke-dasharray="3 3"/>' +
        '<text x="' + X(a) + '" y="114" fill="#b3a49b" font-size="9" text-anchor="middle">' + a + '歳</text>' +
        (md ? '<text x="' + X(a) + '" y="14" font-size="12" text-anchor="middle">' + ({ '金': '🥇', '銀': '🥈', '銅': '🥉' })[md.medal] + '</text>' : '');
    }).join('');
    return '<h3>📈 戦闘力の歩み</h3><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><line x1="' + x0 + '" y1="' + y0 + '" x2="' + (W - 4) + '" y2="' + y0 + '" stroke="#3d2d28"/>' +
      '<text x="2" y="' + (Y(50) + 3) + '" fill="#b3a49b" font-size="9">50</text><line x1="' + x0 + '" y1="' + Y(50) + '" x2="' + (W - 4) + '" y2="' + Y(50) + '" stroke="#2a1f1c"/>' + marks +
      '<polyline points="' + pts + '" fill="none" stroke="#f3d27a" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  }
  function endingExtras() {
    var r = g.rec;
    return '<div class="card">' + powerChart() +
      '<div class="kpis"><div><b>' + r.wins + '</b>勝</div><div><b>' + (r.matches - r.wins) + '</b>敗</div><div><b>' + r.falls + '</b>フォール勝ち</div><div><b>' + r.peak + '</b>最高戦闘力</div></div>' +
      '<div class="small muted center">ケガ ' + r.inj + '回' + (r.matches ? '・勝率 ' + Math.round(r.wins / r.matches * 100) + '%' : '') + '</div></div>' +
      '<div class="card"><h3>📸 結果カード</h3><div id="shareCanvasHost"></div>' +
      '<div class="row"><button class="btn gold" data-act="saveCard">画像を保存</button><button class="btn" data-act="share">シェアする</button></div></div>';
  }
  var cardData = null;
  function drawShareCard() {
    var host = document.getElementById('shareCanvasHost');
    if (!host) return;
    var W = 1080, H = 1350, c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var gold = goldsOf(g).length;
    var bg = x.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0d0a12'); bg.addColorStop(0.55, gold ? '#3a2408' : '#2a1014'); bg.addColorStop(1, '#120d0c');
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    // 光のすじ
    x.save(); x.translate(W / 2, 430); x.globalAlpha = 0.09; x.fillStyle = '#f3d27a';
    for (var i = 0; i < 18; i++) { x.rotate(Math.PI / 9); x.beginPath(); x.moveTo(0, 0); x.lineTo(-70, -1100); x.lineTo(70, -1100); x.fill(); }
    x.restore();
    x.strokeStyle = '#d9ad3c'; x.lineWidth = 8; x.strokeRect(28, 28, W - 56, H - 56);
    x.textAlign = 'center'; x.fillStyle = '#d9ad3c';
    var F = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
    x.font = '700 34px ' + F; x.fillText('W R E S T L I N G   L I F E', W / 2, 110);
    x.fillStyle = '#fff'; x.font = '900 64px ' + F; x.fillText('レスリング人生', W / 2, 195);
    var c2 = function (k) { return g.medals.filter(function (m) { return m.medal === k; }).length; };
    var medals = '🥇'.repeat(Math.min(c2('金'), 4)) + '🥈'.repeat(Math.min(c2('銀'), 3)) + '🥉'.repeat(Math.min(c2('銅'), 3));
    x.font = '150px ' + F; x.fillText(medals || '🤼', W / 2, 400);
    x.fillStyle = '#fff3c4'; var nm = g.name, fs = 110;
    do { x.font = '900 ' + fs + 'px ' + F; fs -= 6; } while (x.measureText(nm).width > W - 160 && fs > 40);
    x.fillText(nm, W / 2, 560);
    // 称号
    var honor = honorAny(); x.font = '800 48px ' + F;
    var hw = x.measureText(honor).width + 90;
    x.strokeStyle = '#f3d27a'; x.lineWidth = 4; x.beginPath();
    var hx = W / 2 - hw / 2, hy = 610, hh = 84, rr = 42;
    x.moveTo(hx + rr, hy); x.arcTo(hx + hw, hy, hx + hw, hy + hh, rr); x.arcTo(hx + hw, hy + hh, hx, hy + hh, rr); x.arcTo(hx, hy + hh, hx, hy, rr); x.arcTo(hx, hy, hx + hw, hy, rr); x.stroke();
    x.fillStyle = '#f3d27a'; x.fillText(honor, W / 2, hy + 59);
    var rows = [
      ['出身', g.pref + '・' + g.ending.age + '歳で引退'],
      ['オリンピック', '金' + c2('金') + ' 銀' + c2('銀') + ' 銅' + c2('銅')],
      ['世界選手権', '優勝 ' + countTitle('世界選手権') + '回'],
      ['通算', g.rec.wins + '勝' + (g.rec.matches - g.rec.wins) + '敗・優勝' + g.titles.length + '回'],
      ['ライバル', g.rival ? g.rival.name + ' に ' + g.rival.w + '勝' + g.rival.l + '敗' : '—'],
      ['最高戦闘力', String(g.rec.peak)]
    ];
    rows.forEach(function (r, i) {
      var y = 800 + i * 74;
      x.textAlign = 'left'; x.fillStyle = '#b3a49b'; x.font = '600 36px ' + F; x.fillText(r[0], 110, y);
      x.textAlign = 'right'; x.fillStyle = '#fff'; x.font = '800 42px ' + F;
      var v = r[1], s2 = 42; while (x.measureText(v).width > 640 && s2 > 24) { s2 -= 2; x.font = '800 ' + s2 + 'px ' + F; }
      x.fillText(v, W - 110, y);
      x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 2; x.beginPath(); x.moveTo(110, y + 22); x.lineTo(W - 110, y + 22); x.stroke();
    });
    x.textAlign = 'center'; x.fillStyle = '#d9ad3c'; x.font = '700 34px ' + F; x.fillText('japanwrestlingchannel.com/game', W / 2, H - 70);
    try { cardData = c.toDataURL('image/png'); } catch (e) { cardData = null; }
    host.innerHTML = cardData ? '<img class="sharecard" alt="結果カード" src="' + cardData + '">' : '';
  }
  function shareText() {
    var c2 = function (k) { return g.medals.filter(function (m) { return m.medal === k; }).length; };
    return '【レスリング人生】' + g.name + '(' + g.pref + ')の人生:' + honorAny() + '。オリンピック 金' + c2('金') + ' 銀' + c2('銀') + ' 銅' + c2('銅') +
      '、通算' + g.rec.wins + '勝' + (g.rec.matches - g.rec.wins) + '敗。 #レスリング人生';
  }
  function doShare() {
    var text = shareText();
    function fallback() {
      var done = function () { toast('📋 結果をコピーしました'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text + ' ' + GAME_URL).then(done, function () { prompt('コピーしてください', text + ' ' + GAME_URL); });
      else prompt('コピーしてください', text + ' ' + GAME_URL);
    }
    if (!navigator.share) return fallback();
    var data = { title: 'レスリング人生', text: text, url: GAME_URL };
    if (cardData && window.File && navigator.canShare) {
      try {
        var bin = atob(cardData.split(',')[1]), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var file = new File([arr], 'wrestling-life.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) data.files = [file];
      } catch (e) {}
    }
    navigator.share(data).catch(function () {});
  }
  function saveCard() {
    if (!cardData) return;
    var a = document.createElement('a'); a.href = cardData; a.download = 'wrestling-life-' + g.name + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('📸 画像を保存しました');
  }

  // ---- 操作 ----
  var busy = false;
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    if (act === 'sound') { settings.sound = !settings.sound; saveSettings(); b.textContent = settings.sound ? '🔊' : '🔇'; if (settings.sound) SFX.click(); return; }
    if (act === 'closeHelp') { var ov = document.querySelector('.overlay'); if (ov && (ev.target === ov || ev.target.closest('button'))) ov.remove(); return; }
    if (act === 'help') { SFX.click(); document.body.insertAdjacentHTML('beforeend', helpOverlay()); return; }
    if (act === 'skip') { skipAnim = true; return; }
    if (act === 'saveCard') { saveCard(); return; }
    if (act === 'share') { doShare(); return; }
    var wasFresh = false;
    if (act === 'new') {
      var input = document.getElementById('nameInput');
      var name = (input.value || '').trim().slice(0, 12);
      if (!name) { input.focus(); input.placeholder = '名前を入れてください'; return; }
      var saved = load();
      if (resumable(saved) && !confirm('いまのセーブデータ(' + saved.name + '・' + saved.age + '歳)は消えます。はじめからにしますか?')) return;
      storeSet(NAME_KEY, name);
      g = WL.newGame(name); SFX.event();
    } else if (act === 'continue') { g = load(); SFX.click(); }
    else if (act === 'hall' || act === 'ach') { view = act; SFX.click(); }
    else if (act === 'back') { view = 'title'; SFX.click(); }
    else if (act === 'speed') { settings.fast = !settings.fast; saveSettings(); SFX.click(); }
    else if (act === 'toInfancy') { WL.startInfancy(g); SFX.click(); }
    else if (act === 'infancy') { WL.chooseInfancy(g, id); SFX.train(); }
    else if (act === 'event') { WL.resolveEvent(g, id); SFX.click(); }
    else if (act === 'train') {
      var r = WL.train(g, id); wasFresh = true;
      if (r && r.injured) { SFX.hurt(); buzz(200); } else if (id === 'rest') SFX.rest(); else SFX.train();
    }
    else if (act === 'tourAdvance') { WL.advanceTournament(g); SFX.click(); if (g.tour && g.tour.cur && !g.tour.cur.periods.length) SFX.cheer(1.2); }
    else if (act === 'tactic') {
      var m = g.tour.cur; if (!m || m.done || m.tie) return;
      var before = { me: m.me, op: m.op }, pn = m.periods.length + 1;
      var per = WL.playPeriod(g, id); if (!per) return;
      save(); animToken++; skipAnim = false; SFX.click();
      animatePeriod(m, per, pn, before);
      return;
    }
    else if (act === 'tieTap') {
      var m2 = g.tour.cur; if (!m2 || !m2.tie) return;
      var ga = document.getElementById('gauge'), cu = document.getElementById('gcur');
      var gr = ga.getBoundingClientRect(), cr = cu.getBoundingClientRect();
      var pos = ((cr.left + cr.width / 2) - gr.left) / gr.width;
      var q = pos >= 0.43 && pos <= 0.57 ? 'great' : pos >= 0.27 && pos <= 0.73 ? 'ok' : 'miss';
      cu.style.animationPlayState = 'paused'; SFX.gauge();
      toast(q === 'great' ? '🎯 完ぺきなタイミング!' : q === 'ok' ? '👌 まずまずのタイミング' : '😣 タイミングがずれた…');
      WL.resolveTie(g, q); save(); animToken++; skipAnim = false;
      b.disabled = true;
      tieAnim(m2, q);
      return;
    }
    else if (act === 'tourDone') { WL.finishTournament(g); if (g.phase === 'ending') SFX.fanfare(); else SFX.click(); }
    else if (act === 'nextYear') { WL.nextYear(g); if (g.phase === 'event') SFX.event(); else SFX.click(); }
    else if (act === 'endingNext') { g.ending.scene = (g.ending.scene || 0) + 1; SFX.click(); }
    else if (act === 'goldContinue') { WL.continueAfterGold(g); SFX.click(); }
    else if (act === 'goldRetire') { WL.retireAfterGold(g); SFX.click(); }
    else if (act === 'toTitle') { save(); g = null; view = 'title'; SFX.click(); }
    else if (act === 'reborn') { storeDel(SAVE_KEY); g = null; view = 'title'; SFX.click(); }
    else return;
    fresh = wasFresh;
    render();
  });

  document.body.insertAdjacentHTML('beforeend', '<div id="topbar"><b>WRESTLING <i>●</i> LIFE</b></div><button id="soundBtn" data-act="sound" aria-label="音のオン・オフ">🔊</button><div id="toasts"></div>');
  render();
})();
</script>
</body>
</html>
